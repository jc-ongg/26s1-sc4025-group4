services:
  database:
    build:
      context: .
      dockerfile: database/Dockerfile
    environment:
      POSTGRES_USER: eatigo
      POSTGRES_PASSWORD: eatigo_demo
      POSTGRES_DB: eatigo
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eatigo -d eatigo"]
      interval: 5s
      timeout: 5s
      retries: 15
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://eatigo:eatigo_demo@database:5432/eatigo
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
volumes:
  postgres_data:
